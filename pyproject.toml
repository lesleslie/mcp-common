[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "mcp-common"
version = "0.34.0"
description = "Oneiric-Native foundation library providing battle-tested patterns for MCP (Model Context Protocol) servers, with YAML configuration, Rich UI, and CLI lifecycle management"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Les Leslie", email = "les@wedgwoodwebworks.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "utilities",
    "http-client",
    "configuration",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "oneiric>=0.33",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "PyJWT>=2.8.0",
    "cryptography>=50.0.2",
    "websockets>=17.2",
    "httpx2>=2.13.1",
    "fastmcp>=4.0.11",
    # Phase 4 (2026-09-15): health aggregator metrics emission
    # (mcp_common.health.metrics.update_health_metrics). prometheus_client
    # is the canonical Prometheus exposition library; every Bodai MCP
    # server already imports it for its existing /metrics endpoint,
    # so making it a direct runtime dep here pins the metrics contract
    # instead of relying on transitive availability.
    "prometheus_client>=0.20.0",
    # Producer telemetry (mcp_common/server/producer_telemetry.py and
    # mcp_common/server/telemetry.py). These four were declared only in
    # this project's own `telemetry` dependency group, and a dependency
    # group is never installed for a consumer -- so every Bodai repo that
    # produces spans had to repeat the same pins in its own pyproject to
    # get an exporter, and any repo that forgot got a server that recorded
    # spans and exported none. Declaring them here puts them where they
    # are imported: the producer API is part of this package's public
    # surface, so a consumer that calls it gets a working exporter without
    # having to know which packages that requires.
    # The version floor matches the rest of the fleet (mahavishnu,
    # crackerjack, session-buddy), so every component that talks to the
    # collector resolves the same API.
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
]

[project.license]
text = "BSD-3-CLAUSE"

[project.urls]
Homepage = "https://github.com/lesleslie/mcp-common"
Documentation = "https://github.com/lesleslie/mcp-common#readme"
Repository = "https://github.com/lesleslie/mcp-common"
Issues = "https://github.com/lesleslie/mcp-common/issues"

[tool.hatchling.build.targets.wheel]
packages = [
    "mcp_common",
]

[tool.hatchling.build.targets.sdist]
# Exclude local-only build artifacts from the source distribution. These
# patterns are also in .gitignore, but hatchling's default sdist walker
# only honors a subset of .gitignore rules and can package hidden venv
# directories (which contain absolute symlinks that fail sdist unpacking).
exclude = [
    ".venv",
    ".test-venv",
    ".test-venv-v1",
    ".test-venv-v2",
    ".test-venv-*",
    "dist",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".crackerjack",
    "*.egg-info",
    ".coverage",
    "htmlcov",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    "tests/",
    "test_*.py",
    "*_test.py",
]

[tool.ruff.lint]
extend-select = [
    "C901",
    "F",
    "I",
    "UP",
]
ignore = [
    "E402",
    "F821",
]
fixable = [
    "ALL",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Demo/example code intentionally catches broad exceptions to be lenient
# in user-facing demonstration flows.
"examples/**/*.py" = ["BLE001"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--cov=mcp_common",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=json",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov-branch",
    "--cov-fail-under=86.42358417377812",
]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests",
    "e2e: End-to-end tests",
    "slow: Slow tests (>2s)",
    "benchmark: Benchmark tests (deferred)",
    "smoke: Quick smoke tests",
    "regression: Regression tests",
    "api: API endpoint tests",
    "unit_async: Async unit tests",
    "requires_network: Tests that need a live network or HTTP endpoint; auto-skip in offline CI",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*:",
    "ignore::DeprecationWarning:networkx.*:",
    "ignore::pytest.PytestUnknownMarkWarning:",
]

[tool.coverage.run]
branch = true
parallel = true
concurrency = [
    "multiprocessing",
]
source = [
    "mcp_common",
]
data_file = ".coverage"
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "*/_version.py",
    "*/conftest.py",
    # Optional-dep adapters: require network/credentials/runtime installs
    # that are not available in CI. See docs/audits/2026-09-05-coverage-ratchet-memo.md
    "mcp_common/llm/*",
    "mcp_common/auth/audit.py",
    "mcp_common/fastmcp/*",
    "mcp_common/validation/*",
    "mcp_common/interfaces/*",
    "mcp_common/tools/dispatch.py",
    "mcp_common/tools/profiles.py",
    "mcp_common/tools/descriptions.py",
    "mcp_common/tools/mermaid_validator/*",
    "mcp_common/baseline_tools.py",
    "mcp_common/contracts.py",
    "mcp_common/bootstrap.py",
    "mcp_common/backends/pyobjc.py",
    "mcp_common/parsing/tree_sitter/*",
    "mcp_common/schemas/*",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
    "raise ImportError",
    "except ImportError",
]

[tool.pyright]
include = [
    "mcp-common",
]
exclude = [
    "tests/*",
    "scratch",
    ".venv",
    "build",
    "dist",
]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.bandit]
target = [
    "mcp-common",
]
skips = [
    "B101",
    "B110",
    "B112",
    "B404",
    "B603",
    "B607",
]
exclude_dirs = [
    "tests/",
]

[tool.codespell]
quiet-level = 3
ignore-words-list = "crate,uptodate,nd,nin"

[tool.creosote]
# Creosote scans [project.dependencies] by default for unused imports.
# Every runtime dep in this project is directly imported in source, so the
# exclusion list would be empty. The previous list mixed transitive dev
# tooling (pytest, ruff, bandit, hatchling, creosote, ...) — none of those
# appear in [project.dependencies], so excluding them was redundant.
# pyright was never installed in this venv, so the exclusion was invalid.
paths = [
    "mcp_common",
]
deps-file = "pyproject.toml"

[tool.refurb]
enable_all = false
quiet = true
python_version = "3.14"
# Refurb drives Mypy internally (Mypy is a hard dependency, not a pluggable
# backend), so Mypy's own flags are the only speed lever available.
#
# ``follow_imports`` defaults to ``normal``: Mypy type-checks every import
# transitively, and any dependency shipping ``py.typed`` is analyzed as if
# it were first-party source. That pulls the whole third-party graph into
# the build to lint the ~119 files in ``mcp_common`` and costs minutes per
# run -- warm cache included, because Refurb forces fine-grained
# incremental mode on, which does not help when the entire third-party
# graph is re-verified each time.
#
# ``skip`` leaves imported modules unanalyzed (``Any``). The scanned
# package's own modules stay in Mypy's build set, so their types stay
# precise and rules that depend on in-package types still fire. What is
# lost is anything whose "correct" answer comes from a third-party
# library's default value: FURB120 (redundant default argument) compares
# the argument against the callee's default, and a skipped library has no
# default to compare against. Measured here with ``--enable-all``: 30
# findings without the flag, 21 with it. The skipped set is a strict
# subset -- no new findings appear -- and this repo's default check set is
# unaffected.
#
# NOTE: this is safe only because the scan covers the whole package. A
# single-file scan puts no sibling modules in Mypy's build set, so their
# types degrade to ``Any`` and type-aware rules stop firing.
#
# ``ignore_missing_imports`` keeps an optional dependency that is absent
# from the current venv (the ``llm`` group's openai is not part of ``dev``)
# from turning into a spurious Mypy import error.
mypy_args = ["--follow-imports=skip", "--ignore-missing-imports"]

[tool.complexipy]
default_pattern = "**/*.py"
exclude_patterns = [
    "**/tests/**",
    "**/test_*.py",
]
max_complexity = 15

# PEP 735 dependency-groups (replaces [project.optional-dependencies]).
# Install with: uv sync --group dev --group treesitter --group llm --group macos-prompts --group terminal-prompts
#
# Note: previous consumers depended on `mcp-common[treesitter,llm]` extras.
# Those have been removed; downstream repos must now include the treesitter
# and openai deps directly in their own dependency-groups.
[dependency-groups]
dev = [
    "crackerjack>=0.85.0",
    "pytest-benchmark>=5.3.0",
    "respx>=0.23.1",
    "uv-bump>=0.6.0",
]

# Tree-sitter parsing support (used by session-buddy, mahavishnu, etc.)
treesitter = [
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-go>=0.25.0",
]

# LLM provider support (openai is the canonical provider; anthropic etc.
# live in their respective downstream repos).
llm = [
    "openai>=3.24.0",
]

# Prompting/notification backends (macOS native prompts via pyobjc).
macos-prompts = [
    "pyobjc-core>=12.2.2",
    "pyobjc-framework-Cocoa>=10.0",
]

# Terminal-based prompts (cross-platform fallback).
terminal-prompts = [
    "prompt-toolkit>=3.0.53",
]

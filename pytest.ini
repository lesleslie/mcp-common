[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
    e2e: End-to-end tests
    slow: Slow tests (>2s)
    benchmark: Benchmark tests (deferred)
    smoke: Quick smoke tests
    regression: Regression tests
    api: API endpoint tests
    unit_async: Async unit tests
    requires_network: Tests that need a live network or HTTP endpoint; auto-skip in offline CI